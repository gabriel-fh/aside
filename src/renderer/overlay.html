<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self'; img-src 'self' data:; media-src 'self' blob:"
    />
    <title>Aside</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="overlay.css" />
  </head>
  <body>
    <div id="root">
      <div id="bar" class="solid" title="Arraste para mover">
        <div id="drag">
          <img src="../../assets/logo.png" alt="" />
          <span>Aside</span>
        </div>
        <span class="sep"></span>
        <button id="rec" class="pill" title="Iniciar ou parar a sessão">
          <span class="dot"></span><span id="recLabel">Iniciar</span>
        </button>
        <div class="meters">
          <div class="mrow" title="Seu microfone">
            <svg class="ic" viewBox="0 0 16 16"><rect x="6" y="2" width="4" height="7.5" rx="2" /><path d="M3.8 8a4.2 4.2 0 0 0 8.4 0M8 12.2V14" /></svg>
            <span class="meter"><i id="mMe"></i></span>
          </div>
          <div class="mrow" title="Som do computador">
            <svg class="ic" viewBox="0 0 16 16"><path d="M2.5 6.2h2.3L8 3.5v9L4.8 9.8H2.5z" /><path d="M10.6 5.8a3.2 3.2 0 0 1 0 4.4" /></svg>
            <span class="meter"><i id="mThem"></i></span>
          </div>
        </div>
        <span class="sep"></span>
        <select id="assistant" title="Modo ativo"></select>
        <button id="answerBtn" class="pill" title="Responder à última pergunta agora">Responder</button>
        <span class="grow"></span>
        <button id="screenBtn" class="ghost" title="Analisar a tela inteira">
          <svg class="ic" viewBox="0 0 16 16"><rect x="1.8" y="2.5" width="12.4" height="8.4" rx="1.4" /><path d="M5.5 13.8h5M8 11v2.8" /></svg>
          Tela
        </button>
        <button id="regionBtn" class="ghost" title="Escolher um trecho da tela para analisar">
          <svg class="ic" viewBox="0 0 16 16"><path d="M2.5 5.5v-2a1 1 0 0 1 1-1h2M10.5 2.5h2a1 1 0 0 1 1 1v2M13.5 10.5v2a1 1 0 0 1-1 1h-2M5.5 13.5h-2a1 1 0 0 1-1-1v-2" /></svg>
          Recorte
        </button>
        <button id="cfgBtn" class="ghost icon" title="Abrir a janela do Aside">
          <svg class="ic" viewBox="0 0 16 16"><path d="M2 4.5h6.5M12 4.5h2M2 11.5h2M7.5 11.5H14" /><circle cx="10.2" cy="4.5" r="1.7" /><circle cx="5.8" cy="11.5" r="1.7" /></svg>
        </button>
        <button id="foldBtn" class="ghost icon" title="Recolher ou expandir o painel">
          <svg class="ic" viewBox="0 0 16 16"><path d="M4 6.5l4 4 4-4" /></svg>
        </button>
        <button id="hideBtn" class="ghost icon" title="Ocultar">
          <svg class="ic" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8" /></svg>
        </button>
      </div>

      <div id="panel" class="solid">
        <div id="head">
          <div class="tabs">
            <button id="tabAnswer" class="seg on">Resposta</button>
            <button id="tabTranscript" class="seg">Transcrição</button>
          </div>
          <span class="grow"></span>
          <span id="quota" hidden><i id="quotaFill"></i><b id="quotaText"></b></span>
          <span id="ctxBadge" hidden></span>
        </div>
        <div id="status" hidden></div>
        <div id="setup" hidden>
          <span><b>Falta conectar a inteligência artificial.</b> Sem isso o Aside não transcreve nem responde.</span>
          <button id="setupBtn" class="pill">Conectar</button>
        </div>
        <div id="answerView">
          <div id="question" hidden></div>
          <div id="answer" class="md"></div>
          <button id="contBtn" class="chip strong" hidden>Continuar a resposta</button>
        </div>
        <div id="transcript" hidden></div>
        <div id="taskBar" hidden>
          <span id="taskLabel">Desafio em etapas</span>
          <button class="chip strong" data-step="next" title="Entrega o próximo passo do plano">Próximo passo</button>
          <button class="chip" data-step="explain" title="Como explicar o último passo ao entrevistador">Explicar este passo</button>
          <button class="chip" id="taskCheck" title="Recorte o seu código para o Aside conferir">Conferir meu código</button>
          <button class="chip" id="taskEnd" title="Sai do desafio atual">Encerrar desafio</button>
        </div>
        <div id="chips">
          <button class="chip" data-ask="O que é mais útil eu dizer agora?">O que dizer agora?</button>
          <button class="chip" data-ask="Resuma a conversa até aqui em poucos pontos.">Resumir até aqui</button>
          <button class="chip" data-ask="Quais perguntas eu deveria fazer agora?">Sugerir perguntas</button>
          <button class="chip" data-screen="1">Analisar a tela</button>
        </div>
        <form id="form">
          <input id="q" type="text" placeholder="Pergunte algo" autocomplete="off" />
          <button id="stopBtn" type="button" class="ghost" hidden>Parar</button>
          <button id="sendBtn" type="submit" class="pill" title="Enviar">
            <svg class="ic" viewBox="0 0 16 16"><path d="M8 13V3.5M3.8 7.5L8 3.3l4.2 4.2" /></svg>
          </button>
        </form>
      </div>
    </div>
    <script src="md.js"></script>
    <script src="audio.js"></script>
    <script src="overlay.js"></script>
  </body>
</html>
